# Serve a SPA e encaminha /api para a API (mesma origem → cookies SameSite=Strict).
# Atenção: add_header em um location anula os herdados do server; por isso os cabeçalhos
# de segurança ficam em um snippet incluído em cada location.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 21m;

  location /api/ {
    include /etc/nginx/snippets/seguranca.conf;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
